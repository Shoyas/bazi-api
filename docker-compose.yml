services:
  nginx:
    image: nginx:alpine
    container_name: bazi_api_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - app-network

  api1:
    build: .
    image: bazi-api
    container_name: bazi_api1
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 5111
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgres://root:password@pgbouncer:6432/bazi_saas?pgbouncer=true"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  api2:
    build: .
    image: bazi-api
    container_name: bazi_api2
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 5111
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgres://root:password@pgbouncer:6432/bazi_saas?pgbouncer=true"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: bazi_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-primary:
    image: postgres:15-alpine
    container_name: bazi_pg_primary
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bazi_saas
    ports:
      - "5432:5432"
    networks:
      - app-network

  postgres-replica:
    image: postgres:15-alpine
    container_name: bazi_pg_replica
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bazi_saas
    ports:
      - "5433:5432"
    networks:
      - app-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bazi_pgbouncer
    environment:
      DB_USER: root
      DB_PASSWORD: password
      DB_HOST: postgres-primary
      DB_NAME: bazi_saas
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:6432"
    depends_on:
      - postgres-primary
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
