services:
  nginx:
    image: nginx:alpine
    container_name: bazi_api_nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-3031}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - app-network

  db-migrate:
    build: .
    image: bazi-api
    container_name: bazi_db_migrate
    restart: "no"
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    env_file: .env
    networks:
      - app-network

  api1:
    build: .
    image: bazi-api
    container_name: bazi_api1
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3031
      REDIS_URL: "redis://redis:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3031/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  api2:
    build: .
    image: bazi-api
    container_name: bazi_api2
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3031
      REDIS_URL: "redis://redis:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3031/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  worker:
    build: .
    image: bazi-api
    container_name: bazi_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      REDIS_URL: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: bazi_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
